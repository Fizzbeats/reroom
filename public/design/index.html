<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReRoom Design-Vorschlag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
  :root {
    --weiss: #FFFFFF; --flaeche: #F1F1EF; --tinte: #111111; --grau: #6B6B6B; --linie: #E5E4E1;
    --orange: #FF5B2E; --gruen: #0B7A4B; --gruen-bg: #E3F3EA;
    --a-gruen: #12924F; --a-gelb: #C98A00; --a-rot: #D63A2A;
    --titel: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DADAD6; font-family: var(--text); color: var(--tinte); padding: 28px 16px; }
  .buehne { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
  .geraet { width: 390px; height: 844px; background: var(--weiss); border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgb(0 0 0 / .18); display: flex; flex-direction: column; }
  .unterschrift { text-align: center; font: 600 14px var(--text); color: #444; margin-top: 10px; }
  .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font: 600 14px var(--text); flex: none; }
  .scroll { flex: 1; overflow: hidden; padding: 0 20px; }
  h1, h2, .preis, .marke { font-family: var(--titel); }
  .kopf { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 14px; }
  .marke { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .marke i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: 2px; }
  .rund { width: 40px; height: 40px; border-radius: 50%; background: var(--flaeche); display: grid; place-items: center; }
  h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 22px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font: 600 13px var(--text); color: var(--grau); }
  /* Raumkarte mit Grundriss */
  .raum { background: var(--tinte); color: #fff; border-radius: 24px; padding: 18px; }
  .raum .zeile { display: flex; justify-content: space-between; align-items: center; }
  .raum h3 { font: 700 20px var(--titel); margin: 0; }
  .raum .chip { background: rgb(255 255 255 / .12); color: #fff; }
  .raum > svg { display: block; width: 100%; height: auto; margin: 10px 0 6px; }
  .werte { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .werte div { background: rgb(255 255 255 / .08); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: #BDBDBD; }
  .werte b { display: block; color: #fff; font: 700 16px var(--titel); }
  .chips { display: flex; gap: 8px; overflow: hidden; }
  .chip { flex: none; border-radius: 999px; padding: 8px 14px; font: 600 13px var(--text); background: var(--flaeche); display: inline-flex; align-items: center; gap: 6px; }
  .chip.an { background: var(--tinte); color: #fff; }
  .chip .punkt { width: 12px; height: 12px; border-radius: 50%; }
  /* Produktkarten */
  .raster { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .bild { position: relative; aspect-ratio: 1 / 1.05; border-radius: 18px; background: var(--flaeche); display: grid; place-items: center; overflow: hidden; }
  .bild svg { width: 92%; height: auto; }
  .ampel { position: absolute; top: 8px; left: 8px; background: #fff; border-radius: 999px; padding: 4px 9px 4px 7px; font: 700 11px var(--text); display: inline-flex; gap: 5px; align-items: center; }
  .ampel::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .herz { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .karte .preis { font-size: 17px; font-weight: 800; margin-top: 8px; letter-spacing: -.01em; }
  .karte .rr { font: 700 11px var(--text); color: var(--gruen); background: var(--gruen-bg); border-radius: 6px; padding: 2px 6px; margin-left: 4px; vertical-align: 2px; }
  .karte .name { font-size: 13px; color: var(--tinte); margin-top: 1px; }
  .karte .meta { font-size: 12px; color: var(--grau); }
  .suche { display: flex; align-items: center; gap: 10px; background: var(--flaeche); border-radius: 14px; padding: 12px 14px; color: var(--grau); font-size: 15px; margin-bottom: 12px; }
  .anzahl { font: 600 13px var(--text); color: var(--grau); margin: 14px 0 10px; }
  /* Navigation */
  .nav { flex: none; display: flex; justify-content: space-around; border-top: 1px solid var(--linie); padding: 10px 6px 26px; background: #fff; }
  .nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 10.5px var(--text); color: #8A8A8A; position: relative; }
  .nav span.an { color: var(--tinte); }
  .nav span.an::after { content: ""; position: absolute; top: -11px; width: 22px; height: 3px; border-radius: 3px; background: var(--orange); }
  .nav svg { width: 24px; height: 24px; }
  .nav .mitte { width: 46px; height: 46px; border-radius: 50%; background: var(--tinte); color: #fff; display: grid; place-items: center; margin-top: -4px; }
  /* Detail */
  .gross { position: relative; height: 330px; background: var(--flaeche); display: grid; place-items: center; flex: none; }
  .gross svg.m { width: 84%; }
  .gross .zurueck { position: absolute; top: 52px; left: 18px; } .gross .herz2 { position: absolute; top: 52px; right: 18px; }
  .gross .zurueck, .gross .herz2 { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .punkte { position: absolute; bottom: 14px; display: flex; gap: 5px; } .punkte i { width: 6px; height: 6px; border-radius: 50%; background: #C9C9C5; } .punkte i:first-child { background: var(--tinte); width: 18px; border-radius: 3px; }
  .det { padding: 16px 20px 0; flex: 1; overflow: hidden; }
  .det .tags { display: flex; gap: 6px; } .tag { font: 700 11px var(--text); border-radius: 6px; padding: 3px 8px; background: var(--flaeche); }
  .det h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin: 8px 0 2px; }
  .det .verk { font-size: 13px; color: var(--grau); }
  .check { border: 1px solid var(--linie); border-radius: 18px; padding: 14px; margin-top: 14px; }
  .check .ober { display: flex; justify-content: space-between; align-items: center; }
  .check .ober b { font: 700 15px var(--titel); }
  .knapp { font: 700 12px var(--text); color: #7A5300; background: #FFF1CC; border-radius: 999px; padding: 4px 10px; }
  .balken { margin-top: 12px; display: grid; gap: 10px; }
  .b { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 10px; font-size: 12.5px; }
  .b .spur { height: 8px; border-radius: 4px; background: var(--flaeche); overflow: hidden; } .b .spur i { display: block; height: 100%; border-radius: 4px; }
  .b em { font-style: normal; font-weight: 700; text-align: right; }
  .check p { font-size: 12.5px; color: var(--grau); margin: 10px 0 0; }
  .masse { display: flex; gap: 8px; margin-top: 12px; } .masse div { flex: 1; background: var(--flaeche); border-radius: 12px; padding: 8px 10px; font-size: 11px; color: var(--grau); } .masse b { display: block; font: 700 16px var(--titel); color: var(--tinte); }
  .leiste { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 20px 30px; border-top: 1px solid var(--linie); }
  .leiste .p { flex: 1; } .leiste .p b { font: 800 22px var(--titel); display: block; } .leiste .p span { font-size: 11.5px; color: var(--grau); }
  .btn { background: var(--tinte); color: #fff; border-radius: 14px; padding: 15px 18px; font: 700 15px var(--text); }
  .btn2 { width: 50px; height: 50px; border-radius: 14px; border: 1.5px solid var(--tinte); display: grid; place-items: center; }
</style>
</head>
<body>
<div class="buehne">
  <div><div class="geraet" id="start"></div><div class="unterschrift">1 · Startseite</div></div>
  <div><div class="geraet" id="entdecken"></div><div class="unterschrift">2 · Entdecken</div></div>
  <div><div class="geraet" id="detail"></div><div class="unterschrift">3 · Möbel-Detail</div></div>
</div>
<script>
// Farben der Möbel (aus dem Feld "farben" im Katalog)
const FARBE = { grau: "#A3A7AB", weiss: "#ECEAE5", holz: "#C9A06E", schwarz: "#2E2E2E", braun: "#80553A", terrakotta: "#C9694C", gruen: "#7E9B7A" };
const dunkler = (hex, f = .78) => "#" + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * f).toString(16).padStart(2, "0")).join("");
const heller = (hex, f = .25) => "#" + [1, 3, 5].map(i => { const v = parseInt(hex.slice(i, i + 2), 16); return Math.round(v + (255 - v) * f).toString(16).padStart(2, "0"); }).join("");
const schatten = '<ellipse cx="100" cy="134" rx="78" ry="6" fill="#000" opacity=".08"/>';
const holz = "#B98C5C";

// Einfache Produkt-Illustrationen je Kategorie
const MOEBEL = {
  sofa: c => `${schatten}<rect x="34" y="54" width="132" height="44" rx="16" fill="${dunkler(c)}"/><rect x="20" y="86" width="160" height="36" rx="13" fill="${c}"/><rect x="14" y="72" width="28" height="50" rx="13" fill="${dunkler(c, .88)}"/><rect x="158" y="72" width="28" height="50" rx="13" fill="${dunkler(c, .88)}"/><rect x="46" y="84" width="52" height="16" rx="7" fill="${heller(c, .18)}"/><rect x="102" y="84" width="52" height="16" rx="7" fill="${heller(c, .18)}"/><rect x="34" y="122" width="6" height="10" rx="2" fill="${holz}"/><rect x="160" y="122" width="6" height="10" rx="2" fill="${holz}"/>`,
  stuhl: c => `${schatten}<rect x="70" y="30" width="60" height="54" rx="12" fill="${dunkler(c, .9)}"/><rect x="62" y="80" width="76" height="16" rx="7" fill="${c}"/><path d="M70 96 64 132M130 96 136 132M82 96 80 128M118 96 120 128" stroke="${holz}" stroke-width="5" stroke-linecap="round"/>`,
  bett: c => `${schatten}<rect x="22" y="40" width="40" height="88" rx="8" fill="${dunkler(c)}"/><rect x="40" y="82" width="150" height="34" rx="8" fill="#F7F6F3"/><rect x="40" y="92" width="150" height="30" rx="8" fill="${c}"/><rect x="48" y="70" width="40" height="18" rx="8" fill="#FFFFFF"/><rect x="36" y="118" width="156" height="10" rx="4" fill="${dunkler(c, .7)}"/>`,
  schrank: c => `${schatten}<rect x="50" y="14" width="100" height="116" rx="6" fill="${c}"/><line x1="100" y1="18" x2="100" y2="126" stroke="${dunkler(c, .8)}" stroke-width="2"/><rect x="90" y="66" width="3" height="16" rx="1.5" fill="${dunkler(c, .6)}"/><rect x="107" y="66" width="3" height="16" rx="1.5" fill="${dunkler(c, .6)}"/><rect x="56" y="128" width="6" height="6" fill="${dunkler(c, .6)}"/><rect x="138" y="128" width="6" height="6" fill="${dunkler(c, .6)}"/>`,
  tisch: c => `${schatten}<rect x="22" y="62" width="156" height="12" rx="4" fill="${c}"/><path d="M38 74 34 130M162 74 166 130M56 74 58 120M144 74 142 120" stroke="${dunkler(c, .75)}" stroke-width="6" stroke-linecap="round"/><rect x="112" y="46" width="20" height="16" rx="3" fill="#FFFFFF"/><path d="M80 62c0-14 8-20 10-26 2 6 10 12 10 26z" fill="#7E9B7A"/>`,
  regal: c => `${schatten}<rect x="58" y="12" width="84" height="120" rx="3" fill="none" stroke="${c}" stroke-width="7"/>${[44, 74, 104].map(y => `<rect x="58" y="${y}" width="84" height="6" fill="${c}"/>`).join("")}<rect x="68" y="22" width="8" height="22" fill="#C9694C"/><rect x="78" y="26" width="7" height="18" fill="#2E2E2E"/><rect x="87" y="20" width="9" height="24" fill="#D9C27A"/><circle cx="120" cy="66" r="8" fill="#7E9B7A"/><rect x="114" y="68" width="12" height="8" rx="2" fill="#ECEAE5"/><rect x="70" y="86" width="22" height="18" rx="3" fill="#ECEAE5"/><rect x="104" y="112" width="8" height="20" fill="#2E2E2E"/><rect x="114" y="116" width="8" height="16" fill="#C9694C"/>`,
  lampe: c => `${schatten}<ellipse cx="100" cy="130" rx="24" ry="5" fill="${dunkler(c, .7)}"/><rect x="98" y="46" width="4" height="84" fill="${dunkler(c, .7)}"/><path d="M72 46h56l-10-32H82z" fill="${c}"/><ellipse cx="100" cy="52" rx="38" ry="10" fill="#FFE7A3" opacity=".55"/>`,
  teppich: c => `${schatten}<path d="M30 118 62 62h108l-32 56z" fill="${c}"/><path d="M46 110 70 70h84l-24 40z" fill="none" stroke="${heller(c, .45)}" stroke-width="3"/><path d="M78 90h44" stroke="${heller(c, .45)}" stroke-width="3"/>`,
};
const bild = (kat, farbe) => `<svg viewBox="0 0 200 150" class="m">${MOEBEL[kat](FARBE[farbe])}</svg>`;

const ICON = {
  home: '<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  suche: '<circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  messen: '<path d="M4 7h16v10H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 7v4M12 7v3M16 7v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  kamera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  tasche: '<path d="M5 8h14l-1 12H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  etikett: '<path d="M3 12V4h8l10 10-8 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="8" r="1.5" fill="currentColor"/>',
  herz: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  filter: '<path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  zurueck: '<path d="m14 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  raum: '<path d="M4 4h16v16H4z M4 14h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
};
const icon = (n, g = 20) => `<svg viewBox="0 0 24 24" width="${g}" height="${g}">${ICON[n]}</svg>`;
const status = '<div class="status"><span>9:41</span><span>●●● ▮</span></div>';
const nav = aktiv => `<nav class="nav">${[["home", "Start"], ["suche", "Entdecken"], ["kamera", "Messen", true], ["tasche", "Warenkorb"], ["etikett", "Verkaufen"]].map(([i, t, m]) =>
  m ? `<span><b class="mitte">${icon(i, 22)}</b>${t}</span>` : `<span class="${t === aktiv ? "an" : ""}">${icon(i, 24)}${t}</span>`).join("")}</nav>`;

// Echte Werte aus dem Katalog und der Passt-Check-Logik (Wohnzimmer: Tür 90 × 210 cm, Treppe 120 cm)
const AMPEL = { gruen: ["Passt", "var(--a-gruen)"], gelb: ["Knapp", "var(--a-gelb)"], rot: ["Passt nicht", "var(--a-rot)"] };
const PRODUKTE = [
  { kat: "sofa", farbe: "grau", name: "Sofa Lund", preis: "180 €", meta: "Gebraucht · 3 km", ampel: "gelb" },
  { kat: "stuhl", farbe: "holz", name: "Stuhl Ahorn", preis: "69 €", rr: "66,24 €", meta: "Neu · Wohnwerk Nord", ampel: "gruen" },
  { kat: "regal", farbe: "schwarz", name: "Regal Raster", preis: "169 €", rr: "162,24 €", meta: "Neu · Stilhaus Elbe", ampel: "gruen" },
  { kat: "lampe", farbe: "schwarz", name: "Stehlampe Bogen", preis: "79 €", rr: "75,84 €", meta: "Neu · Wohnwerk Nord", ampel: "gruen" },
  { kat: "tisch", farbe: "holz", name: "Couchtisch Rund", preis: "45 €", meta: "Gebraucht · 9 km", ampel: "gruen" },
  { kat: "teppich", farbe: "terrakotta", name: "Teppich Kelim", preis: "35 €", meta: "Gebraucht · 1 km", ampel: "gruen" },
];
const karte = p => `<div class="karte"><div class="bild">${bild(p.kat, p.farbe)}<span class="ampel" style="--c:${AMPEL[p.ampel][1]}">${AMPEL[p.ampel][0]}</span><span class="herz">${icon("herz", 16)}</span></div>
  <div class="preis">${p.preis}${p.rr ? `<span class="rr">mit ReRoom ${p.rr}</span>` : ""}</div><div class="name">${p.name}</div><div class="meta">${p.meta}</div></div>`;

// Grundriss 4,00 × 5,00 m mit Tür (90 cm) und Fenster, maßstäblich
const grundriss = `<svg viewBox="0 0 320 200">
  <rect x="40" y="18" width="200" height="160" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M40 18h200v160H40z" fill="rgb(255 255 255 / .04)"/>
  <rect x="38" y="120" width="5" height="36" fill="#111"/><path d="M42 120a36 36 0 0 1 36 36" fill="none" stroke="#FF5B2E" stroke-width="2" stroke-dasharray="3 3"/><line x1="42" y1="120" x2="78" y2="120" stroke="#FF5B2E" stroke-width="2.5"/>
  <rect x="110" y="15" width="70" height="7" fill="#9FC3FF" opacity=".7"/>
  <rect x="150" y="128" width="70" height="30" rx="6" fill="rgb(255 255 255 / .18)"/><text x="185" y="147" fill="#fff" font-size="10" text-anchor="middle" font-family="system-ui">Sofa?</text>
  <text x="140" y="195" fill="#BDBDBD" font-size="11" text-anchor="middle" font-family="system-ui">4,00 m</text>
  <text x="258" y="102" fill="#BDBDBD" font-size="11" font-family="system-ui">5,00 m</text>
  <text x="84" y="142" fill="#FF8A66" font-size="10" font-family="system-ui">Tür 90 cm</text>
</svg>`;

document.getElementById("start").innerHTML = `${status}<div class="scroll">
  <div class="kopf"><span class="marke">ReRoom<i></i></span><span class="rund">${icon("herz", 18)}</span></div>
  <div class="raum"><div class="zeile"><div><span style="font-size:12px;color:#BDBDBD">Dein Raum</span><h3>Wohnzimmer</h3></div><span class="chip">${icon("kamera", 16)} Neu messen</span></div>
    ${grundriss}
    <div class="werte"><div><b>20 m²</b>Fläche</div><div><b>90 cm</b>Tür</div><div><b>120 cm</b>Treppe</div></div></div>
  <h2>Dein Stil <small>Ändern</small></h2>
  <div class="chips"><span class="chip an"><i class="punkt" style="background:#C9A06E"></i>Skandi</span><span class="chip"><i class="punkt" style="background:#2E2E2E"></i>Industrial</span><span class="chip"><i class="punkt" style="background:#C9694C"></i>Boho</span><span class="chip">Vintage</span></div>
  <h2>Passt in dein Wohnzimmer <small>Alle</small></h2>
  <div class="raster">${PRODUKTE.slice(0, 2).map(karte).join("")}</div>
</div>${nav("Start")}`;

document.getElementById("entdecken").innerHTML = `${status}<div class="scroll">
  <div class="kopf"><span class="marke" style="font-size:24px">Entdecken</span><span class="rund">${icon("filter", 18)}</span></div>
  <div class="suche">${icon("suche", 18)} Sofa, Regal, Lampe …</div>
  <div class="chips"><span class="chip an">${icon("raum", 14)} Wohnzimmer</span><span class="chip an">Skandi</span><span class="chip">bis 500 €</span><span class="chip">Gebraucht</span></div>
  <div class="anzahl">24 Möbel passen in dein Wohnzimmer</div>
  <div class="raster">${PRODUKTE.map(karte).join("")}</div>
</div>${nav("Entdecken")}`;

const balken = (name, spiel, max, farbe) => `<div class="b"><span>${name}</span><span class="spur"><i style="width:${Math.min(100, spiel / max * 100)}%;background:${farbe}"></i></span><em>${spiel} cm</em></div>`;
document.getElementById("detail").innerHTML = `<div class="gross"><span class="zurueck">${icon("zurueck", 20)}</span><span class="herz2">${icon("herz", 18)}</span>${bild("sofa", "grau")}<span class="punkte"><i></i><i></i><i></i></span></div>
  <div class="det">
    <div class="tags"><span class="tag">Gebraucht</span><span class="tag">Skandi</span><span class="tag">Grau</span></div>
    <h1>Sofa Lund</h1>
    <div class="verk">Privat · Chemnitz-Kaßberg · 3 km · Abholung</div>
    <div class="check"><div class="ober"><b>Passt-Check · Wohnzimmer</b><span class="knapp">Knapp</span></div>
      <div class="balken">${balken("Tür", 10, 60, "var(--a-gelb)")}${balken("Treppenhaus", 35, 60, "var(--a-gruen)")}${balken("Raum", 200, 60, "var(--a-gruen)")}</div>
      <p>Die Tür ist die engste Stelle: nur 10 cm Spielraum. Bitte nachmessen.</p></div>
    <div class="masse"><div><b>200</b>Breite cm</div><div><b>85</b>Tiefe cm</div><div><b>80</b>Höhe cm</div></div>
