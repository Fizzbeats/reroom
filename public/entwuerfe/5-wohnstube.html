<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entwurf 5: Wohnstube (Vintage)</title>
<link rel="stylesheet" href="base.css" />
<style>
  :root {
    --seite: #CDB98E; --seite-text: #3A2E1C;
    --bg: #F4E8CC; --szene: #E8D7AE; --karte: #FBF3DE; --text: #3A2B1A; --muted: #6B5A3E;
    --primaer: #3F5B3A; --auf-primaer: #FBF3DE; --akzent: #D9A11E; --auf-akzent: #3A2B1A;
    --ampel-gruen: #3A7A3A; --ampel-gelb: #9A6C00; --ampel-rot: #A8321F;
    --schrift: Georgia, "Palatino Linotype", serif; --radius: 10px; --knopf: 8px;
    --schatten: 0 2px 0 rgb(58 43 26 / .25); --h1: 2.1rem; --h1-spacing: .02em;
  }
  .karte { border: 2px solid #3A2B1A; }
  button.primaer { border: 2px solid #3A2B1A; box-shadow: 0 3px 0 #3A2B1A; }
</style>
</head>
<body>
<div class="leiste"><a href="index.html">← Alle Entwürfe</a><button id="bew">Bewegung: an</button></div>
<div class="phone">
  <header class="kopf"><h1>ReRoom</h1><p>Scannen, Stil wählen, günstiger einrichten.</p></header>
  <div class="szene">
    <svg viewBox="0 0 390 250" role="img" aria-label="Wohnstube mit Plattenspieler, Pendeluhr, dampfender Tasse und Katze mit wedelndem Schwanz">
      <defs><pattern id="tapete" width="26" height="40" patternUnits="userSpaceOnUse"><rect width="26" height="40" fill="#E8D7AE"/><rect width="13" height="40" fill="#E1CE9F"/><circle cx="13" cy="20" r="3" fill="#C9AE6E"/></pattern></defs>
      <rect width="390" height="250" fill="url(#tapete)"/>
      <rect y="208" width="390" height="42" fill="#7A5230"/>
      <!-- Bild an der Wand -->
      <g class="tiefe" style="--t:3"><rect x="40" y="26" width="56" height="44" fill="#F4E8CC" stroke="#5A3A1E" stroke-width="5"/><path d="M46 64l16-18 12 12 10-8 8 14z" fill="#6E8F5A"/><circle cx="80" cy="42" r="5" fill="#D9A11E"/></g>
      <!-- Pendeluhr -->
      <g class="tiefe" style="--t:6">
        <rect x="170" y="14" width="46" height="70" rx="8" fill="#5A3A1E"/><circle cx="193" cy="38" r="15" fill="#F4E8CC"/><path d="M193 38V28M193 38l7 4" stroke="#3A2B1A" stroke-width="2" stroke-linecap="round"/>
        <g class="pendel" style="animation-duration:2.4s"><line x1="193" y1="56" x2="193" y2="78" stroke="#D9A11E" stroke-width="2"/><circle cx="193" cy="78" r="5" fill="#D9A11E"/></g>
      </g>
      <!-- Sideboard mit Plattenspieler und Tasse -->
      <g class="tiefe" style="--t:8">
        <rect x="236" y="148" width="136" height="60" rx="4" fill="#8A5A34"/><rect x="244" y="156" width="56" height="44" fill="#6F4526"/><rect x="308" y="156" width="56" height="44" fill="#6F4526"/>
        <rect x="236" y="140" width="136" height="9" fill="#5A3A1E"/>
        <rect x="246" y="124" width="62" height="17" rx="3" fill="#3A2B1A"/>
        <g class="drehen" style="animation-duration:1.8s"><circle cx="272" cy="125" r="13" fill="#111" /><circle cx="272" cy="125" r="8" fill="none" stroke="#444" stroke-width="1"/><circle cx="272" cy="125" r="4" fill="#D9A11E"/><circle cx="278" cy="122" r="1.5" fill="#D9A11E"/></g>
        <path d="M298 112l-20 12" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round"/>
        <!-- Tasse mit Dampf -->
        <rect x="330" y="128" width="20" height="13" rx="3" fill="#F4E8CC"/><path d="M350 131q8 1 0 7" stroke="#F4E8CC" stroke-width="2.5" fill="none"/>
        <g fill="#fff"><circle class="dampf" cx="338" cy="124" r="4"/><circle class="dampf" cx="344" cy="124" r="3.5" style="animation-delay:-1.4s"/><circle class="dampf" cx="334" cy="124" r="3" style="animation-delay:-2.6s"/></g>
        <!-- Musiknoten steigen auf -->
        <g fill="#D9A11E" font-size="14" font-family="serif"><text class="dampf" x="266" y="104" style="animation-duration:4.2s">♪</text><text class="dampf" x="284" y="104" style="animation-duration:5s;animation-delay:-2s">♫</text></g>
      </g>
      <!-- Sessel und Katze -->
      <g class="tiefe" style="--t:10">
        <rect x="72" y="136" width="94" height="52" rx="16" fill="#C9951E"/>
        <rect x="62" y="156" width="114" height="44" rx="14" fill="#D9A11E"/>
        <rect x="82" y="162" width="74" height="24" rx="8" fill="#E8B83E"/>
        <rect x="76" y="198" width="6" height="14" fill="#5A3A1E"/><rect x="156" y="198" width="6" height="14" fill="#5A3A1E"/>
        <!-- Katze sitzt auf dem Sessel -->
        <ellipse cx="118" cy="150" rx="18" ry="14" fill="#6A6F78"/>
        <circle cx="118" cy="132" r="11" fill="#6A6F78"/><path d="M109 124l2-10 6 7zM127 124l-2-10-6 7z" fill="#6A6F78"/>
        <circle cx="114" cy="132" r="1.6" fill="#F4E8CC"/><circle cx="122" cy="132" r="1.6" fill="#F4E8CC"/>
        <path class="schwanz" d="M134 154q18 2 16-18" stroke="#6A6F78" stroke-width="6" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Teppich -->
      <ellipse cx="190" cy="226" rx="100" ry="10" fill="#A8321F" opacity=".85"/>
    </svg>
  </div>
  <section class="inhalt"><h2>Passend für dein Wohnzimmer</h2><div class="karten"></div></section>
  <nav class="tabs" aria-label="Hauptmenü"></nav>
</div>
<script src="base.js"></script>
</body>
</html>
