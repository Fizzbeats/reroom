name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen prüfen
        run: npm run typecheck
      - name: Unit-Tests (Logik, Daten, Farben)
        run: npm test
      - name: Build
        run: npm run build
