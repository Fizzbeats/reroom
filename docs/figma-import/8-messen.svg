<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>8 Messen</title>
<rect id="Hintergrund" width="390" height="844" fill="#FFF8EE"/>
<text x="24" y="76" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Raum messen</text>
<g id="Hinweis"><rect x="24" y="100" width="342" height="64" rx="2" fill="#F6E6DA"/><text x="40" y="126" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Dein Handy misst nicht automatisch. Du kannst</text><text x="40" y="146" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">stattdessen mit einem Foto messen.</text></g>
<g id="Messkarte"><rect x="24" y="180" width="342" height="536" rx="2" fill="#F6E6DA"/>
<text x="40" y="210" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Schritt 1 von 6</text><text x="350" y="210" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#3A0F18" text-anchor="end" opacity="1">Alles auf einmal eintippen</text>
<rect x="40" y="222" width="310" height="4" fill="#E8DDD3"/><rect x="40" y="222" width="52" height="4" fill="#3A0F18"/>
<g id="Skizze Tuer"><rect x="40" y="240" width="310" height="150" rx="2" fill="#FFF8EE"/><rect x="160" y="255" width="70" height="120" rx="2" fill="none" stroke="#3A0F18" stroke-width="3"/>
<path d="M145 315H245M145 308V322M245 308V322" stroke="#FF5B2E" stroke-width="3" fill="none"/></g>
<text x="40" y="424" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Wie breit ist deine Tür?</text>
<text x="40" y="450" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Miss von Rahmen zu Rahmen,</text><text x="40" y="468" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">an der schmalsten Stelle. Die Tür nicht mitmessen.</text>
<text x="40" y="504" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Türbreite in cm</text>
<rect x="40" y="514" width="310" height="48" rx="2" fill="#FFF8EE" stroke="#E2D8CE"/><text x="56" y="543" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">z. B. 85</text>
<rect x="40" y="578" width="310" height="56" rx="2" fill="#FFF8EE" stroke="#E2D8CE"/><text x="195" y="611" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7B1E2E" text-anchor="middle" opacity="1">Mit Foto messen</text>
<rect x="40" y="646" width="310" height="56" rx="2" fill="#3A0F18" opacity=".4"/><text x="195" y="679" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Weiter</text></g>
<g id="Tab-Leiste (Platzhalter, hier die Komponente einsetzen)"><line x1="0" y1="782" x2="390" y2="782" stroke="#E2D8CE"/><text x="39" y="817" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#7A5058" text-anchor="middle" opacity="1">Start</text><text x="117" y="817" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#7A5058" text-anchor="middle" opacity="1">Entdecken</text><text x="195" y="817" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#3A0F18" text-anchor="middle" opacity="1">Messen</text><text x="273" y="817" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#7A5058" text-anchor="middle" opacity="1">Korb</text><text x="351" y="817" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#7A5058" text-anchor="middle" opacity="1">Verkaufen</text></g></svg>