<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>14 Testkasse</title><rect id="Hintergrund" width="390" height="844" fill="#FFF8EE"/><text x="24" y="60" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Warenkorb</text><rect width="390" height="844" fill="#000" opacity=".45"/><g id="Sheet"><rect x="0" y="380" width="390" height="464" rx="20" fill="#FFF8EE" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="426" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Testkasse</text><g id="Schliessen"><circle cx="346" cy="418" r="20" fill="#F6E6DA"/><text x="346" y="425" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#3A0F18" text-anchor="middle" opacity="1">×</text></g><line x1="0" y1="450" x2="390" y2="450" stroke="#E2D8CE"/><rect x="24" y="470" width="342" height="56" rx="2" fill="#FFF1CC" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="495" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Testmodus: Hier gibst du keine Kartendaten ein</text><text x="40" y="513" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">und es wird nichts abgebucht.</text><line x1="24" y1="560" x2="366" y2="560" stroke="#3A0F18"/><text x="24" y="590" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Du zahlst</text><text x="366" y="590" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="end" opacity="1">615,70 €</text><text x="24" y="624" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Echte Zahlungen laufen später über einen Zahlungsdienstleister.</text><text x="24" y="642" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Gebrauchtes Geld bleibt dort, bis die Übergabe bestätigt ist.</text><g id="Knopf Mit Testkarte bezahlen"><rect x="24" y="680" width="342" height="56" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="195.0" y="713.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Mit Testkarte bezahlen</text></g></g></svg>