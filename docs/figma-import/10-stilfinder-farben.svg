<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>10 Stil-Finder Farben</title><rect id="Hintergrund" width="390" height="844" fill="#FFF8EE"/><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Schritt 1: Farben</text><g id="Schliessen"><circle cx="346" cy="56" r="20" fill="#F6E6DA"/><text x="346" y="63" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#3A0F18" text-anchor="middle" opacity="1">×</text></g><text x="24" y="130" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Welche Farben magst du?</text><text x="24" y="168" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Tippe einmal für „mag ich“, zweimal für „mag ich nicht“,</text><text x="24" y="188" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">dreimal zum Zurücksetzen.</text><g id="Farbe grau"><rect x="24" y="232" width="72" height="40" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><circle cx="44" cy="252" r="7" fill="#A3A7AB"/><text x="58" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">grau</text></g><g id="Farbe weiss"><rect x="104" y="232" width="80" height="40" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><circle cx="124" cy="252" r="7" fill="#ECEAE5"/><text x="138" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">weiss</text></g><g id="Farbe holz"><rect x="192" y="232" width="88" height="40" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><circle cx="212" cy="252" r="7" fill="#C9A06E"/><text x="226" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF8EE" text-anchor="start" opacity="1">holz ✓</text></g><g id="Farbe schwarz"><rect x="24" y="284" width="112" height="40" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><circle cx="44" cy="304" r="7" fill="#2E2E2E"/><text x="58" y="309" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1" text-decoration="line-through">schwarz ✕</text></g><g id="Farbe braun"><rect x="144" y="284" width="80" height="40" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><circle cx="164" cy="304" r="7" fill="#80553A"/><text x="178" y="309" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">braun</text></g><g id="Farbe terrakotta"><rect x="232" y="284" width="120" height="40" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><circle cx="252" cy="304" r="7" fill="#C9694C"/><text x="266" y="309" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">terrakotta</text></g><g id="Knopf Weiter zu den Bildern"><rect x="24" y="740" width="342" height="56" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="195.0" y="773.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Weiter zu den Bildern</text></g></svg>