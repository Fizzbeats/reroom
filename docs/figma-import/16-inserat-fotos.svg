<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>16 Inserat Fotos</title><rect id="Hintergrund" width="390" height="844" fill="#FFF8EE"/><text x="24" y="60" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Möbel einstellen</text><g id="Schliessen"><circle cx="346" cy="52" r="20" fill="#F6E6DA"/><text x="346" y="59" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#3A0F18" text-anchor="middle" opacity="1">×</text></g><text x="24" y="96" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Schritt 1 von 4: Fotos</text><rect x="24" y="108" width="342" height="4" rx="2" fill="#E8DDD3" stroke="none" stroke-width="1" opacity="1"/><rect x="24" y="108" width="86" height="4" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="170" font-family="'Source Serif 4', Georgia, serif" font-size="21" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Mach Fotos von deinem Möbel</text><text x="24" y="196" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Das erste Foto ist das Titelbild. Bis zu 4 Fotos.</text><g id="Knopf Foto aufnehmen"><rect x="24" y="224" width="342" height="56" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="195.0" y="257.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Foto aufnehmen</text></g><g id="Knopf Aus der Galerie wählen"><rect x="24" y="292" width="342" height="56" rx="2" fill="#FFF8EE" stroke="#E2D8CE" stroke-width="1" opacity="1"/><text x="195.0" y="325.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7B1E2E" text-anchor="middle" opacity="1">Aus der Galerie wählen</text></g><rect x="24" y="368" width="342" height="100" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><text x="195" y="424" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="middle" opacity="1">Hier erscheinen deine Fotos</text><text x="24" y="506" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">So gelingen gute Fotos</text><g id="Tipp Ganz"><rect x="24" y="520" width="104" height="80" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><rect x="56" y="544" width="40" height="30" rx="8" fill="#3A0F18"/><rect x="66" y="574" width="4" height="10" fill="#3A0F18"/><text x="76" y="624" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A5058" text-anchor="middle" opacity="1">Ganz</text></g><g id="Tipp Gutes Licht"><rect x="143" y="520" width="104" height="80" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><circle cx="195" cy="560" r="14" fill="#E8B923"/><text x="195" y="624" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A5058" text-anchor="middle" opacity="1">Gutes Licht</text></g><g id="Tipp Details"><rect x="262" y="520" width="104" height="80" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><rect x="290" y="544" width="46" height="30" fill="none" stroke="#3A0F18" stroke-width="3"/><text x="314" y="624" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A5058" text-anchor="middle" opacity="1">Details</text></g><g id="Knopf Weiter"><rect x="24" y="740" width="342" height="56" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="195.0" y="773.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Weiter</text></g></svg>