<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>12 Chat</title><rect id="Hintergrund" width="390" height="844" fill="#FFF8EE"/><text x="24" y="64" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="700" fill="#3A0F18" text-anchor="start" opacity="1">Assistent</text><text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Noch 4 von 5 Fragen heute</text><g id="Schliessen"><circle cx="346" cy="64" r="20" fill="#F6E6DA"/><text x="346" y="71" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#3A0F18" text-anchor="middle" opacity="1">×</text></g><line x1="0" y1="104" x2="390" y2="104" stroke="#E2D8CE"/><g id="Bot-Blase 1"><rect x="24" y="124" width="290" height="124" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="150" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Hallo! Ich bin der ReRoom-Assistent, noch</text><text x="40" y="170" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">ohne KI. Ich verstehe Möbelart, Farbe, Stil,</text><text x="40" y="190" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Preis, Entfernung und Nische. Ich kenne die</text><text x="40" y="210" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Maße deines Raums und schlage nur Möbel</text><text x="40" y="230" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">vor, die durch Tür und Treppenhaus passen.</text></g><g id="Nutzer-Blase"><rect x="86" y="268" width="280" height="62" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="1"/><text x="102" y="294" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFF8EE" text-anchor="start" opacity="1">Graues Sofa unter 400 €, das in</text><text x="102" y="314" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFF8EE" text-anchor="start" opacity="1">meine Nische passt.</text></g><g id="Bot-Blase 2"><rect x="24" y="350" width="290" height="62" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="376" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">Wie breit ist deine Nische? Miss von Wand</text><text x="40" y="396" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A0F18" text-anchor="start" opacity="1">zu Wand, zum Beispiel „140 cm“.</text></g><line x1="0" y1="740" x2="390" y2="740" stroke="#E2D8CE"/><rect x="24" y="756" width="252" height="48" rx="2" fill="#F6E6DA" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="786" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7A5058" text-anchor="start" opacity="1">Frag nach einem Möbel …</text><rect x="286" y="756" width="80" height="48" rx="2" fill="#3A0F18" stroke="none" stroke-width="1" opacity="0.4"/><text x="326" y="786" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF8EE" text-anchor="middle" opacity="1">Senden</text></svg>